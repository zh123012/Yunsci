<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yunsci v5</title>
<style>
:root{--bg:#fff;--bg2:#f8f9fa;--bg3:#e9ecef;--bg4:#dee2e6;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--text3:#8b949e;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 12px rgba(0,0,0,.1);--radius:8px;--radius-sm:6px;--font:-apple-system,sans-serif;--mono:monospace;--sidebar-w:340px}
html,body{height:100%;margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
*{box-sizing:border-box}
#auth{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#auth.hide{display:none}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px;width:380px;box-shadow:var(--shadow-lg)}
.card h1{margin:0 0 4px;color:var(--accent);font-size:22px}
.card p{color:var(--text2);font-size:14px;margin-bottom:20px}
.card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin-bottom:10px;outline:none}
.card input:focus{border-color:var(--accent)}
.card button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;margin-top:4px}
.card button:hover{background:var(--accent2)}
.card .err{color:#cf222e;font-size:13px;display:none}
.card .switch{margin-top:12px;font-size:13px;color:var(--text2);text-align:center}
.card .switch a{cursor:pointer;color:var(--accent)}
#reg{display:none}
#app{display:none;flex-direction:column;height:100vh}
#app.show{display:flex}
.nav{display:flex;align-items:center;height:46px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:2px}
.nav-brand{font-weight:700;font-size:17px;margin-right:16px;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-tab{background:none;border:none;padding:6px 12px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:6px;font-weight:500}
.nav-tab:hover{background:var(--bg2);color:var(--text)}
.nav-tab.act{background:#ddf4ff;color:var(--accent)}
.nav-vpn{background:none;border:1px solid var(--border);padding:0;font-size:12px;color:var(--text2);cursor:pointer;border-radius:6px;font-weight:500;display:flex;align-items:center;overflow:hidden}
.nav-vpn .vpn-switch{padding:5px 6px 5px 10px;display:flex;align-items:center;gap:4px}
.nav-vpn .vpn-arrow{padding:5px 8px;border-left:1px solid var(--border);font-size:9px;color:var(--text3)}
.nav-vpn .vpn-arrow:hover{background:var(--bg3);color:var(--text)}
.nav-vpn .vpn-switch:hover{background:var(--bg2)}
.nav-vpn.on .vpn-switch{color:var(--accent)}
.nav-vpn.on{border-color:var(--accent)}
.vpn-menu{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:6px;z-index:200;min-width:200px;max-height:300px;overflow-y:auto;display:none}
.vpn-menu.s{display:block}
.vpn-item{padding:6px 10px;font-size:12px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:space-between}
.vpn-item:hover{background:var(--bg3)}
.vpn-item .nm{flex:1}
.vpn-item .ck{color:var(--green);font-size:14px;visibility:hidden}
.vpn-item.act .ck{visibility:visible}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
#prog-wrap{font-size:11px;color:var(--text)}
#prog-bar{width:120px;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#10b981,#3b82f6);transition:width .4s ease;border-radius:4px}
#prog-pct{font-weight:600;color:var(--accent);min-width:32px;font-family:var(--mono)}
#prog-step{color:var(--text2)}
.nav-r button{background:none;border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2)}
.nav-r button:hover{background:var(--bg2)}
.main{display:flex;flex:1;overflow:hidden}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.conv-bar{display:flex;align-items:center;padding:4px 12px 0;background:var(--bg2);border-bottom:1px solid var(--border);gap:2px;flex-shrink:0;overflow-x:auto}
.conv-tab{display:flex;align-items:center;gap:4px;padding:5px 12px;font-size:12px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;background:var(--bg3);color:var(--text2);white-space:nowrap;flex-shrink:0}
.conv-tab.act{background:var(--bg);color:var(--text);font-weight:600}
.conv-tab .cx{margin-left:4px;font-size:9px;opacity:0;cursor:pointer;padding:1px 4px;border-radius:3px}
.conv-tab:hover .cx{opacity:.5}
.conv-tab .cx:hover{opacity:1;background:var(--bg4)}
.conv-add{background:none;border:1px dashed var(--border);border-bottom:none;border-radius:6px 6px 0 0;padding:5px 10px;cursor:pointer;font-size:14px;color:var(--text3);flex-shrink:0}
.conv-add:hover{color:var(--accent);border-color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:none;min-height:0;height:100%}
.msgs.act{display:block}
.msg{margin-bottom:16px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg-h{font-size:12px;color:var(--text3);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.msg-h .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.msg-h .av.u{background:var(--accent)}
.msg-h .av.a{background:linear-gradient(135deg,var(--accent),var(--green))}
.msg-b{padding:10px 14px;border-radius:8px;line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:break-word}
.msg-b.u{background:var(--accent);color:#fff;border-bottom-right-radius:2px;max-width:80%;margin-left:auto}
.msg-b.a{background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:2px}
.msg-b.a pre{background:var(--bg3);padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;border:1px solid var(--border);margin:6px 0}
.msg-b.a code{background:var(--bg4);padding:2px 5px;border-radius:3px;font-size:13px}
.msg-b.a h2,.msg-b.a h3,.msg-b.a h4{margin:8px 0 4px;color:var(--accent2)}
.msg-b.a table{border-collapse:collapse;margin:6px 0;width:100%;font-size:13px}
.msg-b.a td,.msg-b.a th{border:1px solid var(--border);padding:5px 8px;text-align:left}
.msg-b.a th{background:var(--bg3);font-weight:600}
.msg-b.a blockquote{border-left:3px solid var(--accent);padding-left:10px;margin:6px 0;color:var(--text2)}
.think{border:1px solid var(--border);border-radius:6px;margin:6px 0;overflow:hidden;font-size:13px}
.think-h{padding:4px 10px;background:var(--bg3);cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px}
.think-h:hover{background:var(--bg4)}
.think-b{padding:4px 10px 8px;display:none;font-style:italic;color:var(--text2);font-size:12px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.think-b.s{display:block}
.think-h .ar{transition:transform .15s;display:inline-block;font-size:9px}
.think-h .ar.o{transform:rotate(90deg)}
.tool-call{border-left:3px solid var(--accent);padding:3px 10px;margin:4px 0;font-size:12px;color:var(--accent);font-family:var(--mono);background:var(--accent-light);border-radius:0 4px 4px 0;background:#ddf4ff}
.inp-area{flex-shrink:0;padding:10px 16px 12px;border-top:1px solid var(--border);background:var(--bg)}
.inp-rw{display:flex;gap:8px;max-width:900px;margin:0 auto}
.inp-wrap{position:relative;flex:1}
.inp-wrap textarea{width:100%;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;min-height:44px;max-height:120px}
.inp-wrap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ddf4ff}
.inp-rw button{width:44px;height:44px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;align-self:flex-end}
.inp-rw button:hover{background:var(--accent2)}
.inp-rw button:disabled{opacity:.4}
.inp-hint{font-size:11px;color:var(--text3);max-width:900px;margin:2px auto 0;padding:0 4px;display:flex;justify-content:space-between}
.skill-popup{position:absolute;bottom:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);display:none;z-index:50;margin-bottom:4px}
.skill-popup.s{display:block}
.skill-item{padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;border-bottom:1px solid var(--border)}
.skill-item:last-child{border-bottom:none}
.skill-item:hover,.skill-item.sel{background:#ddf4ff}
.skill-item .sn{font-weight:600;color:var(--accent);font-family:var(--mono);font-size:11px}
.skill-item .sd{color:var(--text2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-empty{padding:12px;text-align:center;color:var(--text3);font-size:12px}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s,margin .2s}
.sidebar.cl{width:0!important;min-width:0!important;margin-left:-1px;overflow:hidden!important;border-left:none;flex:0 0 0!important}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-tab{flex:1;padding:7px 6px;font-size:12px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--text2);font-weight:500;text-align:center}
.sidebar-tab:hover{color:var(--text)}
.sidebar-tab.act{border-bottom-color:var(--accent);color:var(--accent)}
.sidebar-add{width:36px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text2);flex-shrink:0}
.sidebar-add:hover{color:var(--accent)}
.sidebar-body{flex:1;overflow-y:auto;padding:8px;min-height:0}
.sidebar-panel{display:none;height:100%;flex-direction:column}
.sidebar-panel.act{display:flex}
.sidebar-tog{display:flex;align-items:center;padding:5px 8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text2);cursor:pointer;flex-shrink:0;gap:3px;background:var(--bg2)}
.sidebar-tog:hover{background:var(--bg3)}
.skill-cat{font-size:12px;font-weight:600;color:var(--text);padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-top:4px}
.skill-cat:first-child{margin-top:0}
.fbrowser{font-size:12px;height:100%;display:flex;flex-direction:column}
.fb-path{display:flex;align-items:center;gap:4px;padding:5px 4px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0}
.fb-path .seg{cursor:pointer;color:var(--accent);font-size:11px}
.fb-path .seg:hover{text-decoration:underline}
.fb-body{flex:1;overflow-y:auto}
.fb-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;cursor:pointer}
.fb-item:hover{background:var(--bg3)}
.fb-item .fi{width:18px;text-align:center;font-size:13px}
.fb-item .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.fb-item .fs{color:var(--text3);font-size:11px;white-space:nowrap}
.fb-item .fd,.fb-item .fr,.fb-item .fdel{font-size:11px;padding:0 2px;cursor:pointer;visibility:hidden;text-decoration:none}
.fb-item:hover .fd,.fb-item:hover .fr,.fb-item:hover .fdel{visibility:visible}
.fb-item .fd{color:var(--accent)}
.fb-item .fr{color:var(--green)}
.fb-item .fdel{color:var(--red)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:.3s}
.toast.s{opacity:1}
</style></head>
<body>
<div id="auth"><div class="card">
<div id="log"><h1>Yunsci</h1><p>AI-powered bioinformatics & research platform</p>
<input type="text" id="lu" placeholder="Username"><input type="password" id="lp" placeholder="Password">
<div class="err" id="le"></div><button id="lb" onclick="login()">Log In</button>
<div class="switch">No account? <a onclick="sreg()">Register</a></div></div>
<div id="reg"><h1>Yunsci</h1><p>Create your account</p>
<input type="text" id="ru" placeholder="Username"><input type="password" id="rp" placeholder="Password (6+)"><input type="password" id="rc" placeholder="Confirm">
<div class="err" id="re"></div><button id="rb" onclick="register()">Register</button>
<div class="switch">Have an account? <a onclick="slog()">Log In</a></div></div></div></div>
<div id="app">
<div class="nav"><div class="nav-brand">Yunsci <span style="font-size:10px;font-weight:400;color:var(--text3)">v5</span></div>
<button class="nav-tab act" onclick="swView('chat')">💬 Chat</button>
<div class="nav-vpn" id="vpn-btn">
  <span class="vpn-switch" onclick="toggleVpnSwitch()" title="开/关 VPN">🛡️ <span id="vpn-state">Off</span></span>
  <span class="vpn-arrow" onclick="togVpn()" title="切换节点">▼</span>
</div>
<button class="nav-tab" onclick="swView('explore')">🔍 Explore</button>
<div class="nav-r"><span id="st">Ready</span><div id="prog-wrap" style="display:none;align-items:center;gap:8px;margin-left:12px"><div id="prog-bar"><div id="prog-fill"></div></div><span id="prog-pct">0%</span><span id="prog-step" style="font-size:11px;color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div><span id="cost" style="font-size:11px"></span>
<button onclick="document.getElementById('fu').click()">📤</button><input type="file" id="fu" multiple style="display:none" onchange="up(event)">
<button onclick="logout()">🚪</button></div></div>
<div class="main">
<div class="chat"><div id="cb" class="conv-bar"></div>
<div id="ms-area" style="flex:1;position:relative;display:flex;flex-direction:column;min-height:0"></div>
<div class="inp-area"><div class="inp-rw"><div class="inp-wrap"><textarea id="inp" rows="1" placeholder='Ask Yunsci... Type "/" for skills'></textarea><div class="skill-popup" id="sp"></div></div>
<button id="sbtn" onclick="if(this.textContent==='⬜'){cancelRun()}else{send()}">➤</button></div><div class="inp-hint"><span id="hint-text">Enter send · Shift+Enter newline</span><span id="us"></span></div></div></div>
<div class="sidebar" id="sb"><div class="sidebar-tabs"><button class="sidebar-tab" data-sidebar="uploads">📤 Uploads</button><button class="sidebar-tab act" data-sidebar="output">📊 Output</button><button class="sidebar-add" onclick="newFolder()" title="新建文件夹">📁+</button></div>
<div class="sidebar-body"><div class="sidebar-panel" id="sp-uploads"></div><div class="sidebar-panel act" id="sp-output" style="display:flex"></div></div></div>
<div class="sidebar-tog" id="sbt">◀</div></div></div>
<div class="toast" id="toast"></div>
<div class="vpn-menu" id="vpn-menu"></div>
<script>
var ws=null,tok=localStorage.getItem('t'),user=localStorage.getItem('u'),busy=0,actC=null,cList=[],pendingMsg=[];
var skl=[],spi=-1,sf='';

if(tok&&user){fetch('/api/me',{headers:{Authorization:'Bearer '+tok}}).then(function(r){if(r.ok)enter();else{localStorage.clear();tok=null;user=null}})}
function sreg(){document.getElementById('log').style.display='none';document.getElementById('reg').style.display='block'}
function slog(){document.getElementById('log').style.display='block';document.getElementById('reg').style.display='none'}
async function login(){var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim();if(!u||!p)return alert('Fill fields');document.getElementById('lb').disabled=1;document.getElementById('le').style.display='none';try{var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});var d=await r.json();if(d.success){tok=d.token;user=d.username;localStorage.setItem('t',tok);localStorage.setItem('u',user);enter()}else document.getElementById('le').innerHTML=d.error;document.getElementById('le').style.display='block'}catch(e){}document.getElementById('lb').disabled=0}
async function register(){var u=document.getElementById('ru').value.trim(),p=document.getElementById('rp').value,c=document.getElementById('rc').value;if(!u||!p||p.length<6||p!=c)return alert('Check fields');document.getElementById('rb').disabled=1;try{var r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});var d=await r.json();if(d.success){tok=d.token;user=d.username;localStorage.setItem('t',tok);localStorage.setItem('u',user);enter()}else alert(d.error||'Failed')}catch(e){}document.getElementById('rb').disabled=0}
function logout(){if(ws)ws.close();localStorage.clear();tok=null;user=null;document.getElementById('app').classList.remove('show');document.getElementById('auth').classList.remove('hide');cList=[];document.getElementById('ms-area').innerHTML=''}
function swView(v){document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.toggle('act',t.textContent.trim()[0]===(v==='chat'?'💬':'🔍'))});if(v==='explore')showExplore();else showChat()}
function showChat(){var a=document.getElementById('ms-area');a.style.display='flex';Array.from(a.children).forEach(function(c){c.style.display=c.id==='m-'+actC?'block':'none'});var i=document.querySelector('.inp-area');if(i)i.style.display='block'}
function showExplore(){var a=document.getElementById('ms-area');a.style.display='block';a.style.overflow='auto';Array.from(a.children).forEach(function(c){c.style.display='none'});document.querySelector('.inp-area').style.display='none';
  var p=document.getElementById('ms-area');p.innerHTML='<div style="padding:12px;text-align:center;color:var(--text3)">加载中...</div>';
  Promise.all([
    fetch('/api/skills',{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json()}).then(function(d){return d.skills||[]}),
    new Promise(function(r){r()})
  ]).then(function(results){
    var skills=results[0];var cats={};skills.forEach(function(s){var cat=s.name.split('.')[0]||'other';if(!cats[cat])cats[cat]=[];cats[cat].push(s)});
    var icons={'bio':'🧬','cs':'💻','sa':'📊','ns':'📝','air':'🤖','sa.':'🔬','qiushi':'📖','paper':'📄','other':'🔧'};
    var names={'bio':'生物信息学','cs':'计算机科学','sa':'科学分析','ns':'自然科学','air':'AI 研究','sa.':'生物信息学','qiushi':'方法论','paper':'论文工作流','other':'其他'};
    var h='<div style="padding:12px;overflow-y:auto;height:100%"><div style="max-width:700px;margin:0 auto">';
    // Guide section
    h+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px">\
<h2 style="margin:0 0 8px;font-size:16px;color:var(--accent)">📖 Yunsci 使用指南</h2>\
<div style="font-size:13px;line-height:1.8;color:var(--text2)">\
<p><b>💬 快速开始</b> — 在聊天框输入问题，按 Enter 发送。小云会自动分析数据、编写代码、生成结果。</p>\
<p><b>💡 使用技能</b> — 输入 <code>/</code> 弹出技能列表，选择需要的技能快速调用。也可以在下方浏览全部技能。</p>\
<p><b>📤 上传文件</b> — 点击顶部的 📤 按钮上传数据文件（CSV、FASTA、图片等），文件保存到你的个人工作区。</p>\
<p><b>📂 查看输出</b> — 右侧栏 Files 标签页可以浏览和下载结果文件。</p>\
</div></div>';
    // Skills section
    h+='<h2 style="margin:12px 0 8px;font-size:16px;color:var(--accent)">🔍 全部技能</h2><p style="margin:0 0 8px;font-size:12px;color:var(--text2)">共 '+skills.length+' 个可用技能 — 在聊天框输入 <code>/</code> 快速搜索</p>';
    Object.keys(cats).sort().forEach(function(c){if(cats[c].length<2&&c==='other')return;
      h+='<div class="skill-cat" style="font-size:13px;font-weight:600;color:var(--text);padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-top:8px">'+(icons[c]||'🔧')+' '+(names[c]||c)+' <span style="font-weight:400;font-size:11px;color:var(--text3)">('+cats[c].length+')</span></div><div class="skill-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0">';

  document.getElementById('vpn-state').textContent='On';
  // 通知后端开启代理
  await fetch('/api/vpn/on',{method:'POST',headers:{Authorization:'Bearer '+tok}});
  if(vpnNode){await selVpnNode(vpnNode)}
  toast('VPN 已开启，后续任务将走代理');
}
async function closeVpn(){
  vpnOn=false;
  var btn=document.getElementById('vpn-btn');
  btn.classList.remove('on');
  document.getElementById('vpn-state').textContent='Off';
  await fetch('/api/vpn/off',{method:'POST',headers:{Authorization:'Bearer '+tok}});
  document.getElementById('vpn-menu').classList.remove('s');
  toast('VPN 已关闭');
}
function toggleVpnSwitch(){
  if(vpnOn){closeVpn()}else{openVpn()}
}
async function selVpnNode(name){
  vpnNode=name;
  var r=await fetch('/api/vpn/node',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({name:name})});
  var d=await r.json();
  if(d.success){renderVpnMenu();toast('节点: '+name)}else{toast('切换失败')}
}
document.addEventListener('click',function(e){
  var menu=document.getElementById('vpn-menu');
  if(!menu.classList.contains('s'))return;
  if(e.target.closest('.vpn-menu')||e.target.closest('.nav-vpn'))return;
  menu.classList.remove('s');
});
var vpnNodes=[];
loadVpnNodes();
